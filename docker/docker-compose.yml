
services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: blue-bookstore-web
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-blue_bookstore}
      DB_USER: ${DB_USER:-bookstore_user}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: blue-bookstore-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-blue_bookstore}
      MYSQL_USER: ${DB_USER:-bookstore_user}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - bookstore_data:/var/lib/mysql
      - ../database.sql:/docker-entrypoint-initdb.d/01-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: blue-bookstore-phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  bookstore_data:

